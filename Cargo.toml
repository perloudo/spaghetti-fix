[package]
name = "spaghetti-fix"
version = "0.1.0"
edition = "2021"
description = "Split monolithic SQL into modular dbt projects"
license = "MIT"
repository = "https://github.com/perloudo/spaghetti-fix"
keywords = ["dbt", "sql", "refactoring", "cte"]
categories = ["command-line-utilities", "development-tools"]

[dependencies]
sqlparser = { version = "0.59", features = ["serde", "visitor"] }
clap = { version = "4.5", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_yml = "0.0.12"
petgraph = "0.8"
thiserror = "2"
anyhow = "1"
colored = "2"
log = "0.4"
env_logger = "0.11"
regex = "1"

[dev-dependencies]
insta = { version = "1", features = ["yaml"] }
tempfile = "3"
pretty_assertions = "1"
